services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: prcoverage
      POSTGRES_PASSWORD: prcoverage
      POSTGRES_DB: prcoverage
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U prcoverage']
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ../..
      dockerfile: coverage-service/api/Dockerfile
    ports:
      - '3000:3000'
    env_file: .env
    environment:
      DATABASE_URL: postgresql://prcoverage:prcoverage@postgres:5432/prcoverage?schema=public
      REDIS_URL: redis://redis:6379
      API_PORT: 3000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  worker:
    build:
      context: ../..
      dockerfile: coverage-service/worker/Dockerfile
    env_file: .env
    environment:
      DATABASE_URL: postgresql://prcoverage:prcoverage@postgres:5432/prcoverage?schema=public
      REDIS_URL: redis://redis:6379
      WORK_DIR: /tmp/pr-coverage-runs
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      api:
        condition: service_started
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
    security_opt:
      - no-new-privileges:true
    read_only: false
    tmpfs:
      - /tmp:size=1G,mode=1777
    restart: unless-stopped

volumes:
  postgres_data:
